# The build itself is the gate. Directory.Build.props turns the SDK analyzers and
# the .editorconfig code-style rules into warnings, and TreatWarningsAsErrors turns
# those into failures, so there is no separate lint step to keep in sync with it.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or PR supersedes the run in flight. Pushes to
# main are never cancelled, so every merged commit keeps a complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # Both platforms, because this is a program about file paths, byte offsets and
    # line terminators, and those are exactly the things that differ between them.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    # A run takes about four minutes; this stops a hung test from holding a runner
    # for GitHub's six-hour default.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build

  # Release builds compile out every Debug.Assert, so this leg is the only place the
  # loser-tree and staging invariants actually run. One OS is enough for that.
  debug-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build -c Debug

      - name: Test
        run: dotnet test -c Debug --no-build
